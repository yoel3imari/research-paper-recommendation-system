[project]
name = "research-paper-recommendation"
version = "0.1.0"
description = "arXiv paper recommendation system — streaming ingest, ONNX embedding, FAISS index, FastAPI serving, Streamlit demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu==1.10.0",
    "fastapi>=0.141.1",
    "numpy<2",
    "onnxruntime==1.19.2",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "streamlit>=1.60.0",
    "tokenizers>=0.22.2",
    "transformers>=4.57.6",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
